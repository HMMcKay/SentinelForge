title: Command Shell Followed by PowerShell
id: SF-CMD-POWERSHELL-SEQUENCE
status: experimental
description: Correlates a command-shell start followed by PowerShell on the same host and user.
author: SentinelForge
date: "2026-07-27"
version: 1
logsource:
  product: windows
  category: process_creation
detection:
  selection_shell:
    event_type: process_start
    process.name: cmd.exe
  selection_powershell:
    event_type: process_start
    process.name:
      - powershell.exe
      - pwsh.exe
  condition: selection_shell or selection_powershell
falsepositives:
  - Administrative scripts and developer tooling that chain command interpreters.
level: medium
tags:
  - attack.t1059.003
  - attack.t1059.001
investigation: Review both command lines, process GUID lineage, user context, and any child activity.
sentinelforge:
  confidence: 65
  correlation:
    type: sequence
    steps:
      - selection_shell
      - selection_powershell
    within: 2m
    group_by:
      - host.hostname
      - user.name
    deduplicate: 5m
