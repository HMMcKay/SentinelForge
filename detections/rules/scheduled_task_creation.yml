title: Scheduled Task Creation
id: SF-SCHEDULED-TASK-CREATE
status: experimental
description: Detects scheduled-task creation telemetry from the normalized event stream.
author: SentinelForge
date: "2026-07-27"
version: 1
logsource:
  product: windows
  category: process_creation
detection:
  selection_process:
    event_type: process_start
    process.name: schtasks.exe
  selection_create:
    process.command_line|contains: "/create"
  condition: selection_process and selection_create
falsepositives:
  - Approved software deployment, maintenance, and inventory tasks.
level: medium
tags:
  - attack.t1053.005
investigation: Inspect the task principal, trigger, executable, arguments, author, and creation process.
sentinelforge:
  confidence: 72
