[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sentinelforge-backend"
version = "0.1.0"
description = "SentinelForge telemetry ingestion and detection API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.140.7",
  "psycopg[binary]==3.2.9",
  "pydantic==2.13.4",
  "PyYAML==6.0.2",
  "sqlalchemy==2.0.41",
  "structlog==25.4.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency markers are intentionally evaluated in signatures.
