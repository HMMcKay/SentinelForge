[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sentinelforge-backend"
version = "0.1.0"
description = "SentinelForge telemetry ingestion and detection API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.142.2",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "sqlalchemy==2.1.3",
  "structlog==26.1.0",
  "starlette==1.7.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency markers are intentionally evaluated in signatures.
