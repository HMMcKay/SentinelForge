name: Supply chain

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement backend/requirements.txt
          pip-audit --requirement cli/requirements.txt
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Audit sensor dependencies
        shell: pwsh
        run: |
          dotnet restore agent/SentinelForge.Agent.sln --locked-mode --configfile agent/NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'Locked sensor dependency restore failed.' }
          $output = dotnet list agent/SentinelForge.Agent.sln package --vulnerable --include-transitive
          $output | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($output -match '^\s*>\s')) { throw 'Vulnerable NuGet dependency reported.' }

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sentinelforge.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinelforge-sbom
          path: sentinelforge.spdx.json
          if-no-files-found: error
          retention-days: 14
