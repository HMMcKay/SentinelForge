name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]"
      - name: Lint
        run: ruff check backend
      - name: Test backend, rules, and integration boundary
        working-directory: backend
        run: pytest -q
      - name: Publication check regressions
        run: python -m unittest discover -s scripts/tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e "./cli[dev]"
      - run: ruff check cli
      - run: pytest -q
        working-directory: cli

  sensor:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: agent/**/packages.lock.json
      - run: dotnet restore agent/SentinelForge.Agent.sln --locked-mode
      - run: dotnet test agent/SentinelForge.Agent.sln --no-restore --configuration Release
      - name: Scenario containment tests
        shell: pwsh
        run: pwsh -NoProfile -File simulations/tests/Run-SafetyTests.ps1

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - context: ./backend
            file: ./backend/Dockerfile
          - context: ./frontend
            file: ./frontend/Dockerfile
          - context: ./cli
            file: ./cli/Dockerfile
          - context: ./docker/postgres
            file: ./docker/postgres/Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
      SENTINELFORGE_ENROLLMENT_KEY: ci-enrollment-key-at-least-32-characters
      SENTINELFORGE_ADMIN_KEY: ci-admin-key-at-least-32-characters
      SENTINELFORGE_TOKEN_PEPPER: ci-token-pepper-at-least-32-characters
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated stack
        run: docker compose up --build -d --wait
      - name: Seed demo
        run: docker compose --profile tools run --rm sentinelctl demo seed --seed 1337
      - name: Browser flow
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            compose-e2e.log
            frontend/output/playwright
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
